name: 🤖 Autonomous AI Bug Fixer

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    # Run if issue is labeled 'bug' or 'auto-fix', or title starts with '[Bug]', or comment is '/fix'
    if: >
      github.event_name == 'issues' && (
        contains(github.event.issue.labels.*.name, 'bug') ||
        contains(github.event.issue.labels.*.name, 'auto-fix') ||
        startsWith(github.event.issue.title, '[Bug]') ||
        startsWith(github.event.issue.title, '[bug]')
      ) || (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/fix')
      )
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧠 Run Autonomous Gemini Auto-Fix Agent
        env:
          GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/auto-fix-agent.js

      - name: 🚀 Commit, Push & Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ -f auto-fix-summary.json ]; then
            BRANCH_NAME="auto-fix/issue-${ISSUE_NUM}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git checkout -b "$BRANCH_NAME"
            git add src/
            
            DIAGNOSIS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).diagnosis)")
            COMMIT_MSG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).commitMessage)")
            PR_DESC=$(node -e "console.log(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).prDescription)")

            git commit -m "$COMMIT_MSG"
            git push -f origin "$BRANCH_NAME"

            PR_URL=$(gh pr create \
              --title "🤖 Auto-Fix for Issue #${ISSUE_NUM}: ${COMMIT_MSG}" \
              --body "## 🤖 Autonomous AI Fix Report

Closes #${ISSUE_NUM}

### 🔍 Root Cause Diagnosis
$DIAGNOSIS

### 🧪 Automated Verification
- \`npm run lint\` passed (0 errors)
- \`npm run build\` passed (0 errors)

---
*Generated automatically by Autonomous Gemini Bug-Fix Agent.*" \
              --base main \
              --head "$BRANCH_NAME")

            gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Fix Generated!**

I analyzed the bug and generated a verified fix that passed all build tests:
👉 **Pull Request**: $PR_URL

**Diagnosis**:
> $DIAGNOSIS"
          else
            echo "No summary file produced; skipping PR creation."
          fi
