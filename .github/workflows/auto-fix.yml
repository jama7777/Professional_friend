name: 🤖 Autonomous AI Bug Fixer

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

# Prevent duplicate parallel runs when an issue is created with multiple labels
concurrency:
  group: auto-fix-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    # Trigger on any issue opened or labeled, or comment containing /fix
    if: |
      github.event_name == 'issues' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/fix')
      )

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧠 Run Autonomous Multi-LLM Auto-Fix Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.VITE_MISTRAL_API_KEY }}
          VITE_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.VITE_MISTRAL_API_KEY }}
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY || 'stub' }}
          VITE_CONVAI_API_KEY: ${{ secrets.VITE_CONVAI_API_KEY || 'stub' }}
          VITE_CONVAI_CHARACTER_ID: ${{ secrets.VITE_CONVAI_CHARACTER_ID || 'stub' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/auto-fix-agent.js

      - name: 🚀 Commit, Push & Open Single Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ ! -f auto-fix-summary.json ]; then
            echo "⚠️  No auto-fix-summary.json produced — skipping PR creation."
            exit 0
          fi

          # Deterministic single branch per issue (prevents multiple branch pollution)
          BRANCH_NAME="auto-fix/issue-${ISSUE_NUM}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH_NAME"
          git add src/ scripts/

          DIAGNOSIS=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).diagnosis)")
          COMMIT_MSG=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).commitMessage)")

          # Skip if no code changes
          if git diff --cached --quiet; then
            echo "ℹ️  No file changes — leaving diagnostic comment on the issue."
            gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Analysis Complete**

          The agent ran successfully but determined **no code changes are needed** for this issue.

          **Diagnosis**:
          > ${DIAGNOSIS}"
            exit 0
          fi

          git commit -m "$COMMIT_MSG"
          git push -f origin "$BRANCH_NAME"

          # Check if PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json url --jq '.[0].url')

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ Existing PR updated: $EXISTING_PR"
            gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Fix Updated!**

          I pushed an updated fix to the existing PR:
          👉 **Pull Request**: $EXISTING_PR

          **Updated Diagnosis**:
          > ${DIAGNOSIS}"
          else
            PR_URL=$(gh pr create \
              --title "🤖 Auto-Fix for Issue #${ISSUE_NUM}: ${COMMIT_MSG}" \
              --body "## 🤖 Autonomous AI Fix Report

            Closes #${ISSUE_NUM}

            ### 🔍 Root Cause Diagnosis
            ${DIAGNOSIS}

            ### 🧪 Automated Verification
            - \`npm run lint\` passed (0 TypeScript errors)
            - \`npm run build\` passed (Vite bundle compiled successfully)

            ---
            *Generated automatically by the Autonomous AI Bug-Fix Agent.*" \
              --base main \
              --head "$BRANCH_NAME" 2>&1) || true

            if echo "$PR_URL" | grep -q "https://github.com"; then
              echo "✅ Pull Request created: $PR_URL"
              gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Fix Ready for Review!**

            I diagnosed the bug and generated a verified fix that passed all build checks.

            👉 **Pull Request**: $PR_URL

            **Root Cause**:
            > ${DIAGNOSIS}"
            else
              MANUAL_URL="https://github.com/jama7777/Professional_friend/pull/new/${BRANCH_NAME}"
              gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Fix Generated!**

            The fix was committed and pushed to branch \`${BRANCH_NAME}\`.

            👉 **Open the PR here**: $MANUAL_URL

            **Root Cause**:
            > ${DIAGNOSIS}"
            fi
          fi
