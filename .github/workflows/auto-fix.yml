name: 🤖 Autonomous AI Bug Fixer

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: auto-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-fix:
    name: auto-fix
    if: |
      (github.event_name == 'issues') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: ⚙️ Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧠 Run Autonomous Auto-Fix Agent (Gemini 2.5 Flash → Mistral Large fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.VITE_MISTRAL_API_KEY }}
          VITE_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.VITE_MISTRAL_API_KEY }}
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY || 'stub' }}
          VITE_CONVAI_API_KEY: ${{ secrets.VITE_CONVAI_API_KEY || 'stub' }}
          VITE_CONVAI_CHARACTER_ID: ${{ secrets.VITE_CONVAI_CHARACTER_ID || 'stub' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/auto-fix-agent.js

      - name: 🚀 Commit & Push Verified Fix Directly to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ ! -f auto-fix-summary.json ]; then
            echo "⚠️  No auto-fix-summary.json produced — skipping push."
            exit 0
          fi

          DIAGNOSIS=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).diagnosis)")
          COMMIT_MSG=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).commitMessage)")
          NO_CHANGES=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).noChanges || false))")

          if [ "$NO_CHANGES" = "true" ] || (git diff --quiet && git diff --staged --quiet); then
            echo "ℹ️  No file changes — leaving diagnostic comment on the issue."
            gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Analysis Complete**

          The agent analyzed this issue and verified that **no code changes are needed** (or the codebase already satisfies this request).

          **Diagnosis**:
          > ${DIAGNOSIS}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash changes → pull latest main → pop stash → commit → push with retry
          # This avoids "could not apply" conflicts when multiple runs execute concurrently
          git add -A
          git stash push -u -m "auto-fix-stash-${ISSUE_NUM}" || true
          git pull --rebase origin main || true
          git stash pop || true
          git add -A

          if git diff --staged --quiet; then
            echo "ℹ️  Changes already applied by another run — no commit needed."
            gh issue comment "$ISSUE_NUM" --body "🤖 Fix already applied by a concurrent run."
            exit 0
          fi

          git commit -m "$COMMIT_MSG (fixes #${ISSUE_NUM})"

          # Push with up to 3 retries for concurrent push races
          for i in 1 2 3; do
            if git push origin main; then
              echo "✅ Pushed on attempt $i"
              break
            fi
            echo "⚠️  Push attempt $i failed — rebasing and retrying..."
            git pull --rebase origin main
          done

          COMMIT_SHA=$(git rev-parse --short HEAD)

          gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Fix Applied Directly to \`main\`!**

          A verified fix was automatically tested and pushed directly to the **\`main\`** branch.

          - **Commit**: \`${COMMIT_SHA}\` — \`${COMMIT_MSG}\`
          - **Verification**: \`npm run lint\` & \`npm run build\` passed (0 errors)
          - **Deployment**: Vercel is now deploying this fix to production automatically.

          **Root Cause Diagnosis**:
          > ${DIAGNOSIS}"

          gh issue close "$ISSUE_NUM" --reason "completed"
