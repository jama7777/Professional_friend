name: 🤖 Autonomous AI Bug Fixer

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    # Trigger when:
    #   - a new issue is labeled 'bug' or 'auto-fix', or title starts with [Bug]/[bug]
    #   - a comment on any issue contains '/fix'
    if: |
      (
        github.event_name == 'issues' &&
        (
          contains(github.event.issue.labels.*.name, 'bug') ||
          contains(github.event.issue.labels.*.name, 'auto-fix') ||
          startsWith(github.event.issue.title, '[Bug]') ||
          startsWith(github.event.issue.title, '[bug]') ||
          startsWith(github.event.issue.title, '[Feature]')
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/fix')
      )

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧠 Run Autonomous Gemini Auto-Fix Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Stub the other VITE_ vars so vite build doesn't crash on missing env
          VITE_MISTRAL_API_KEY: ${{ secrets.VITE_MISTRAL_API_KEY || 'stub' }}
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY || 'stub' }}
          VITE_CONVAI_API_KEY: ${{ secrets.VITE_CONVAI_API_KEY || 'stub' }}
          VITE_CONVAI_CHARACTER_ID: ${{ secrets.VITE_CONVAI_CHARACTER_ID || 'stub' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/auto-fix-agent.js

      - name: 🚀 Commit, Push & Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ ! -f auto-fix-summary.json ]; then
            echo "⚠️  No auto-fix-summary.json produced — skipping PR creation."
            exit 0
          fi

          BRANCH_NAME="auto-fix/issue-${ISSUE_NUM}-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add src/ scripts/

          DIAGNOSIS=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).diagnosis)")
          COMMIT_MSG=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).commitMessage)")

          # Skip if nothing changed
          if git diff --cached --quiet; then
            echo "ℹ️  No file changes — leaving a diagnostic comment on the issue."
            gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Analysis Complete**

          The agent ran successfully but determined **no code changes are needed** for this issue.

          **Diagnosis**:
          > ${DIAGNOSIS}"
            exit 0
          fi

          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH_NAME"

          # Try to open a PR; if the repo setting blocks it, fall back to a comment with a manual link
          PR_URL=$(gh pr create \
            --title "🤖 Auto-Fix for Issue #${ISSUE_NUM}: ${COMMIT_MSG}" \
            --body "## 🤖 Autonomous AI Fix Report

          Closes #${ISSUE_NUM}

          ### 🔍 Root Cause Diagnosis
          ${DIAGNOSIS}

          ### 🧪 Automated Verification
          - \`npm run lint\` passed (0 TypeScript errors)
          - \`npm run build\` passed (Vite bundle compiled successfully)

          ---
          *Generated automatically by the Autonomous Gemini Bug-Fix Agent.*" \
            --base main \
            --head "$BRANCH_NAME" 2>&1) || true

          if echo "$PR_URL" | grep -q "https://github.com"; then
            echo "✅ Pull Request created: $PR_URL"
            gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Fix Ready for Review!**

          I diagnosed the bug and generated a verified fix that passed all build checks.

          👉 **Pull Request**: $PR_URL

          **Root Cause**:
          > ${DIAGNOSIS}"
          else
            # PR creation blocked by repo permissions — post a manual merge link instead
            MANUAL_URL="https://github.com/jama7777/Professional_friend/pull/new/${BRANCH_NAME}"
            echo "⚠️  Automatic PR creation blocked. Posting manual link."
            gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Fix Generated!**

          The fix was committed and pushed, but automatic PR creation is blocked by repository settings.

          👉 **Open the PR manually here**: $MANUAL_URL

          **What was fixed**:
          > ${DIAGNOSIS}

          ---
          *To enable fully automatic PRs: go to **Settings → Actions → General → Workflow permissions** and check ✅ **Allow GitHub Actions to create and approve pull requests**.*"
          fi
