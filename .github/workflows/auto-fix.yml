name: 🤖 Autonomous AI Bug Fixer

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

# Prevent duplicate parallel runs on the same issue
concurrency:
  group: auto-fix-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-fix:
    # Trigger on any issue opened or labeled, or comment containing /fix
    if: |
      github.event_name == 'issues' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/fix')
      )

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: ⚙️ Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧠 Run Autonomous Auto-Fix Agent (GitHub Models FREE + Gemini/Mistral fallback)
        env:
          # 🆓 Primary engine: GitHub Models API — FREE, uses built-in GITHUB_TOKEN, no extra keys needed
          # Provides: GPT-4o mini, DeepSeek-v3, Codestral, Mistral-Nemo and more
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 🔑 Fallback engines (optional — agent works without these via GitHub Models)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.VITE_MISTRAL_API_KEY }}
          VITE_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.VITE_MISTRAL_API_KEY }}
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY || 'stub' }}
          VITE_CONVAI_API_KEY: ${{ secrets.VITE_CONVAI_API_KEY || 'stub' }}
          VITE_CONVAI_CHARACTER_ID: ${{ secrets.VITE_CONVAI_CHARACTER_ID || 'stub' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/auto-fix-agent.js

      - name: 🚀 Commit & Push Verified Fix Directly to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ ! -f auto-fix-summary.json ]; then
            echo "⚠️  No auto-fix-summary.json produced — skipping push."
            exit 0
          fi

          DIAGNOSIS=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).diagnosis)")
          COMMIT_MSG=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('auto-fix-summary.json')).commitMessage)")

          # Skip if no code changes in entire repository
          if git diff --quiet; then
            echo "ℹ️  No file changes — leaving diagnostic comment on the issue."
            gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Analysis Complete**

          The agent analyzed this issue and verified that **no code changes are needed** (or the codebase already satisfies this request).

          **Diagnosis**:
          > ${DIAGNOSIS}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all verified fixes in the repository
          git add -A
          git commit -m "$COMMIT_MSG (fixes #${ISSUE_NUM})"

          # Pull rebase in case of concurrent commits, then push directly to main
          git pull --rebase origin main
          git push origin main

          COMMIT_SHA=$(git rev-parse --short HEAD)

          # Comment and close the issue
          gh issue comment "$ISSUE_NUM" --body "🤖 **Autonomous AI Fix Applied Directly to \`main\`!**

          A verified fix was automatically tested and pushed directly to the **\`main\`** branch.

          - **Commit**: \`${COMMIT_SHA}\` — \`${COMMIT_MSG}\`
          - **Verification**: \`npm run lint\` & \`npm run build\` passed (0 errors)
          - **Deployment**: Vercel is now deploying this fix to production automatically.

          **Root Cause Diagnosis**:
          > ${DIAGNOSIS}"

          gh issue close "$ISSUE_NUM" --reason "completed"
